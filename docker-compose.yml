# ─────────────────────────────────────────────────────────────────────────────
# GRAG AI — Full Stack Docker Compose
# Services: Neo4j | Ollama (GPU) | FastAPI GRAG Pipeline | Open WebUI (GPU)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Neo4j Knowledge Graph ─────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.20
    container_name: grag-neo4j
    ports:
      - "7474:7474"    # HTTP browser
      - "7687:7687"    # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j/neo4j.conf:/conf/neo4j.conf:ro
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-password} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    restart: unless-stopped

  # ── Ollama Local LLM — NVIDIA GPU with GPU-Optimized Modelfile ────────────
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    profiles: ["ollama-local-container"]
    container_name: grag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ${OLLAMA_MODELS_PATH:-${USERPROFILE}\\.ollama}:/root/.ollama
    environment:
      - OLLAMA_NUM_GPU=${OLLAMA_NUM_GPU:-99}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-3}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    healthcheck:
      # ollama/ollama image has no curl — use the ollama CLI to check readiness
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ── Model Puller — preloads chat + embedding models on GPU ─────────────────
  embedding-init:
    image: ollama/ollama:latest
    profiles: ["ollama-local-container"]
    container_name: grag-embedding-init
    volumes:
      - ${OLLAMA_MODELS_PATH:-${USERPROFILE}\\.ollama}:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "echo 'Verifying GPU models from shared cache...' && sleep 2 && ollama list && ollama show qwen3.5:4b >/dev/null && ollama show qwen3-embedding:0.6b >/dev/null && echo 'GPU models ready from shared cache.'"
    restart: "no"

  # ── GRAG FastAPI Pipeline ─────────────────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grag-api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - chromadb_data:/data/chromadb
    env_file:
      - .env
    environment:
      # Override localhost addresses for Docker networking
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:4b}
      - OLLAMA_USE_CLOUD=${OLLAMA_USE_CLOUD:-false}
      - OLLAMA_CLOUD_URL=${OLLAMA_CLOUD_URL:-https://api.ollama.com/v1}
      - OLLAMA_CLOUD_MODEL=${OLLAMA_CLOUD_MODEL:-minimax-m2.7:cloud}
      - OLLAMA_CLOUD_API_KEY=${OLLAMA_CLOUD_API_KEY:-}
      - OLLAMA_NUM_GPU=${OLLAMA_NUM_GPU:-99}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OLLAMA_REQUEST_TIMEOUT_SEC=${OLLAMA_REQUEST_TIMEOUT_SEC:-120}
      - QUERY_USE_CLOUD=${QUERY_USE_CLOUD:-false}
      - QUERY_PARALLEL_LLM=${QUERY_PARALLEL_LLM:-false}
      - QUERY_PARALLEL_TIMEOUT_SEC=${QUERY_PARALLEL_TIMEOUT_SEC:-10}
      - QUERY_INTENT_MAX_TOKENS=${QUERY_INTENT_MAX_TOKENS:-200}
      - QUERY_CYPHER_MAX_TOKENS=${QUERY_CYPHER_MAX_TOKENS:-320}
      - QUERY_INTENT_TIMEOUT_SEC=${QUERY_INTENT_TIMEOUT_SEC:-8}
      - QUERY_CYPHER_TIMEOUT_SEC=${QUERY_CYPHER_TIMEOUT_SEC:-12}
      - QUERY_ENABLE_WARMUP=${QUERY_ENABLE_WARMUP:-true}
      - QUERY_WARMUP_TIMEOUT_SEC=${QUERY_WARMUP_TIMEOUT_SEC:-20}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      - CHROMADB_PATH=/data/chromadb
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - API_KEY=${API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-grag-pipeline-v1}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Open WebUI — Chat Interface ───────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: grag-open-webui
    ports:
      - "3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      # ── Ollama integration (for direct model access in WebUI) ──────────────
      - OLLAMA_BASE_URL=http://ollama:11434

      # ── GRAG pipeline as OpenAI-compatible backend ─────────────────────────
      # This is the primary custom backend — GRAG pipeline appears as a model
      - OPENAI_API_BASE_URL=http://fastapi:8000/v1
      - OPENAI_API_KEY=${API_KEY:-grag-local}

      # ── Authentication ────────────────────────────────────────────────────
      - WEBUI_AUTH=true

      # ── Disable telemetry ─────────────────────────────────────────────────
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false

      # ── WebUI settings ────────────────────────────────────────────────────
      - WEBUI_NAME=GRAG AI
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

# ─────────────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data:
  chromadb_data:
  open_webui_data:
