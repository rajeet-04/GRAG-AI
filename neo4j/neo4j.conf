# Neo4j Configuration for GRAG AI
# Heap strictly limited to 2GB per hardware constraints

# Allow compatibility with legacy key names used in this config file.
server.config.strict_validation.enabled=false

# Memory settings tuned for local Docker Desktop runs (still <= 2GB cap)
dbms.memory.heap.max_size=512M
dbms.memory.heap.initial_size=128M
dbms.memory.pagecache.size=128M

# Security
dbms.security.auth_enabled=true

# Transaction Settings
dbms.memory.transaction.timeout=60s
dbms.lock.acquisition.timeout=30s

# Network Connector
dbms.connector.http.listen_address=0.0.0.0:7474
dbms.connector.bolt.listen_address=0.0.0.0:7687

# APOC Configuration (for temporal queries)
dbms.security.procedures.unrestricted=apoc.*
dbms.security.procedures.allowlist=apoc.*

# Performance
dbms.checkpoint.interval.time=300s
dbms.checkpoint.interval.tx=10000
dbms.transaction.bookmark_ready_timeout=30s

# Logging
db.logs.query.enabled=OFF
dbms.logs.query.threshold=0

# Initial password is provided via NEO4J_AUTH in docker-compose
